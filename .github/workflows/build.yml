name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名（例如 1.0.0）'
        required: false
        default: '1.23'

env:
  VERSION_NAME: ${{ github.event.inputs.version_name || '1.23' }}
  VERSION_CODE: '25'
  # ubuntu-latest 预装了 Android SDK，直接用；不走会坏的 setup-android action
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: 构建 FlowStudio
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 接受 SDK 许可
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "许可已处理"

      - name: 安装 NDK 与 CMake
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: C++ 引擎自测
        run: |
          # 引擎是纯 C++17，先在宿主机跑一遍离线渲染测试。
          # 音色、混音、效果器都在这步验证，挂了就没必要打包。
          g++ -std=c++17 -O2 -Iengine/include \
            engine/src/voice.cpp \
            engine/src/effect.cpp \
            engine/src/engine.cpp \
            engine/src/audio_null.cpp \
            engine/test/host_test.cpp \
            -o /tmp/engine_test
          /tmp/engine_test
          # 上面必须全绿才算过：这里的回归测试覆盖了"播放无声"那类
          # 渲染循环根本没跑的问题，光编译通过不代表能出声。

      - name: 静态检查（防回归）
        run: |
          set -e

          # 1) 包络缓存 key 不许再写回 `id * N xor cols`。
          #    1.22 真机闪退的根因就是这个表达式：它把片段 id 和像素列数
          #    混进同一个数值空间，两个不同长度的包络撞成同一个 key，
          #    按当前列数循环就写越界。
          #
          #    判定方式必须稳：注释里提到这个写法是允许的（就在本文件上方
          #    几行的说明里），只有真的出现在代码行上才算回退。
          #    用 awk 逐行判断"去掉前导空白后是否以 * 或 // 开头"，
          #    不依赖 grep 的 \s 是否被支持 —— CI 的 grep 就不支持。
          HITS=$(awk '
            /xor cols/ {
              line = $0
              # 取第一个非空白字符，判断是不是注释
              if (line ~ /^[[:space:]]*\*/) next
              if (line ~ /^[[:space:]]*\/\//) next
              print FILENAME ":" FNR ": " line
            }
          ' app/src/main/java/com/volt/flowstudio/ui/PlaylistView.kt || true)

          if [ -n "$HITS" ]; then
            echo "✗ 又在代码里出现了把列数 xor 进缓存 key 的写法："
            echo "$HITS"
            echo "  用带长度的数据类做 key；PlaylistView.EnvelopeKey 是正确做法"
            exit 1
          fi
          echo "✓ 包络缓存 key 未回退"

          # 2) drawNoteEnvelope 里的循环上界必须来自数组自身，不能再用 cols。
          #    energy 是从缓存取回来的，它的长度未必等于本次的 cols。
          #    （drawAudioWave 里用 cols 是对的 —— 那里的数组就是按 cols 现算的，
          #      所以检查只限定在 drawNoteEnvelope 函数体内。）
          BAD=$(awk '
            /private fun drawNoteEnvelope/ { inside = 1 }
            inside && /for \(c in 0 until cols\)/ { print FNR ": " $0 }
            inside && /^    }$/ { inside = 0 }
          ' app/src/main/java/com/volt/flowstudio/ui/PlaylistView.kt || true)

          if [ -n "$BAD" ]; then
            echo "✗ drawNoteEnvelope 里又按 cols 循环了："
            echo "$BAD"
            echo "  上界要用 energy.size.coerceAtMost(cols)"
            exit 1
          fi
          echo "✓ drawNoteEnvelope 循环上界取自数组长度"

          echo "✓ 静态检查通过"

      - name: 构建 Release APK
        run: |
          gradle :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 校验产物
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "没有生成 APK"; exit 1; }
          echo "APK: $APK"
          ls -la "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libflowengine.so" || { echo "缺少原生库"; exit 1; }
          echo "libflowengine.so 已打包"
          unzip -l "$APK" | grep -q "classes.dex" || { echo "缺少 classes.dex"; exit 1; }
          echo "APK_SIZE=$(stat -c%s "$APK")" >> $GITHUB_ENV

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowStudio-release-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowStudio-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 写入构建摘要
        if: always()
        run: |
          {
            echo "## FlowStudio 构建"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本 | $VERSION_NAME |"
            echo "| APK 体积 | $(( ${APK_SIZE:-0} / 1024 / 1024 )) MB |"
            echo "| 架构 | arm64-v8a |"
            echo "| 引擎 | 自写 C++17 + AAudio |"
          } >> $GITHUB_STEP_SUMMARY
