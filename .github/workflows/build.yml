name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名（例如 1.0.0）'
        required: false
        default: '1.22'

env:
  VERSION_NAME: ${{ github.event.inputs.version_name || '1.22' }}
  VERSION_CODE: '23'
  # ubuntu-latest 预装了 Android SDK，直接用；不走会坏的 setup-android action
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: 构建 FlowStudio
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 接受 SDK 许可
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "许可已处理"

      - name: 安装 NDK 与 CMake
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          ls "$ANDROID_HOME/ndk"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: C++ 引擎自测
        run: |
          # 引擎是纯 C++17，先在宿主机跑一遍离线渲染测试。
          # 音色、混音、效果器都在这步验证，挂了就没必要打包。
          g++ -std=c++17 -O2 -Iengine/include \
            engine/src/voice.cpp \
            engine/src/effect.cpp \
            engine/src/engine.cpp \
            engine/src/audio_null.cpp \
            engine/test/host_test.cpp \
            -o /tmp/engine_test
          /tmp/engine_test
          # 上面必须全绿才算过：这里的回归测试覆盖了"播放无声"那类
          # 渲染循环根本没跑的问题，光编译通过不代表能出声。

      - name: 构建 Release APK
        run: |
          gradle :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 校验产物
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "没有生成 APK"; exit 1; }
          echo "APK: $APK"
          ls -la "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libflowengine.so" || { echo "缺少原生库"; exit 1; }
          echo "libflowengine.so 已打包"
          unzip -l "$APK" | grep -q "classes.dex" || { echo "缺少 classes.dex"; exit 1; }
          echo "APK_SIZE=$(stat -c%s "$APK")" >> $GITHUB_ENV

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowStudio-release-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FlowStudio-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: 写入构建摘要
        if: always()
        run: |
          {
            echo "## FlowStudio 构建"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本 | $VERSION_NAME |"
            echo "| APK 体积 | $(( ${APK_SIZE:-0} / 1024 / 1024 )) MB |"
            echo "| 架构 | arm64-v8a |"
            echo "| 引擎 | 自写 C++17 + AAudio |"
          } >> $GITHUB_STEP_SUMMARY
